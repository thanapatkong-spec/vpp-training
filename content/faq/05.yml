question: "ผ่านการอบรมแล้วสามารถทำงานแทนสัตวแพทย์ได้หรือไม่?"
answer: "ไม่ได้ ผู้ช่วยสัตวแพทย์ทำหน้าที่สนับสนุนงานพยาบาลสัตว์ภายใต้การกำกับดูแลของสัตวแพทย์ ตามขอบเขตและบทบาทหน้าที่ที่สัตวแพทยสภากำหนด เช่น การควบคุมสัตว์ การเตรียมอุปกรณ์ การดูแลสัตว์ป่วยเบื้องต้น และการช่วยงานผ่าตัด การอบรมไม่ได้ทำให้เป็นสัตวแพทย์ หรือทำหัตถการในขอบเขตวิชาชีพสัตวแพทย์ได้"
order: 50
