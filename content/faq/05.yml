question: "ผ่านการอบรมแล้วสามารถทำงานแทนสัตวแพทย์ได้หรือไม่?"
answer: "ผู้ช่วยสัตวแพทย์ที่ผ่านการอบรมหลักสูตร VPP ทำงานร่วมกับสัตวแพทย์ ไม่ใช่ทำแทน โดยช่วยเหลือสัตวแพทย์ในการปฏิบัติงานรักษาสัตว์ ในสถานพยาบาลที่ขึ้นทะเบียนได้อย่างถูกต้อง มีหลักการ ตามขอบเขตและบทบาทหน้าที่ที่สัตวแพทยสภากำหนด เช่น การควบคุมสัตว์ การเตรียมอุปกรณ์ การดูแลสัตว์ป่วยเบื้องต้น และการช่วยงานผ่าตัด ภายใต้การดูแลของสัตวแพทย์ผู้ควบคุมอย่างใกล้ชิด"
order: 50
