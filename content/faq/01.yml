question: "หลักสูตรเรียนในรูปแบบใด?"
answer: "ภาคทฤษฎีเรียนสดออนไลน์ รวม 24 ชั่วโมง 30 นาที อบรม 4 วัน วันละ 6 ชั่วโมง (09:00–12:00 และ 13:00–16:00 น.) แล้วสอบวัดผลหลังเรียนจบ ส่วนภาคปฏิบัติ 12 ชั่วโมง อบรม 2 วัน (09:00–16:00 น.) ณ รพส.คชาเวท ลาซาล เรียนเวียนตามฐานฝึกปฏิบัติจริง เช่น การทำแผล การเจาะเลือด การวางยาสลบ เทคนิคปลอดเชื้อ และการช่วยชีวิตฉุกเฉิน (CPR) จบด้วยสอบภาคปฏิบัติ มอบประกาศนียบัตร และถ่ายภาพรวม ผู้เรียนต้องเข้าอบรมครบทั้งภาคทฤษฎีและภาคปฏิบัติ 100% จึงจะถือว่าจบการฝึกอบรม"
order: 10
