question: "ค่าอบรมเท่าไร และเลือกเรียนแยกภาคได้หรือไม่?"
answer: "ภาคทฤษฎี 7,000 บาท ภาคปฏิบัติ 10,000 บาท หรือสมัครครบ 2 ภาค 15,000 บาท (ประหยัด 2,000 บาท) เลือกเรียนเฉพาะภาคทฤษฎีได้ แต่ภาคปฏิบัติสมัครอย่างเดียวไม่ได้ ต้องเรียนคู่กับภาคทฤษฎี และใบประกาศนียบัตรสำหรับนำไปขึ้นทะเบียนกับสัตวแพทยสภาต้องเรียนและสอบผ่านทั้ง 2 ภาค"
order: 20
