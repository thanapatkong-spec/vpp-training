question: "หลักสูตรเหมาะกับใคร?"
answer: "เหมาะกับพนักงานใหม่ของโรงพยาบาลสัตว์ ผู้ช่วยแพทย์ที่ต้องการเพิ่มทักษะ และโรงพยาบาลสัตว์/คลินิกที่ต้องการสร้างมาตรฐานให้ทีม คุณสมบัติผู้เข้าอบรม: ผ่านการคัดเลือกจากหน่วยงานที่มีผู้ประกอบการสัตวแพทย์ชั้นหนึ่งกำกับดูแล สำเร็จการศึกษาตั้งแต่มัธยมศึกษาปีที่ 6 หรือเทียบเท่า มีสัญชาติไทย และสุขภาพแข็งแรง ไม่มีโรคหรือความผิดปกติที่เป็นอุปสรรคต่อการปฏิบัติงาน"
order: 40
