question: "สมัครเรียนและชำระเงินอย่างไร?"
answer: "ติดต่อทีมงานผ่าน LINE @dr.john อีเมล info@vetvpp.com หรือโทร 094-825-2545 โดยแจ้งชื่อ-นามสกุล เบอร์โทร แพ็กเกจที่สนใจ (ภาคทฤษฎี / ภาคปฏิบัติ / ครบ 2 ภาค) และโรงพยาบาลหรือคลินิกที่สังกัด ทีมงานจะแจ้งรอบเรียนที่เปิดรับ ขั้นตอนการสมัคร และการชำระเงินกลับไป ทั้งนี้ผู้เข้าอบรมต้องผ่านการคัดเลือกจากหน่วยงานที่มีผู้ประกอบการสัตวแพทย์ชั้นหนึ่งกำกับดูแล"
order: 30
