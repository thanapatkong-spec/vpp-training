name: GitHub Pages (redirect to Vercel)

# เว็บหลักย้ายไป Vercel แล้ว — GitHub Pages เหลือแค่หน้าส่งต่อ ลิงก์เก่ายังใช้ได้ (พาไปหน้าเดียวกันบน Vercel)
on:
  push:
    branches: [main]
    paths: [".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build redirect page
        run: |
          mkdir site
          cat > site/index.html <<'HTML'
          <!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="robots" content="noindex">
          <title>VPP · ย้ายไปที่ใหม่</title>
          <script>
            var p = location.pathname.replace(/^\/vpp-training/, "") || "/";
            location.replace("https://vpp-training.vercel.app" + p + location.search + location.hash);
          </script>
          <meta http-equiv="refresh" content="0; url=https://vpp-training.vercel.app/">
          </head><body><p>เว็บไซต์ VPP ย้ายไปที่ <a href="https://vpp-training.vercel.app/">vpp-training.vercel.app</a></p></body></html>
          HTML
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
