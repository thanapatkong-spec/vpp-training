backend:
  name: github
  repo: thanapatkong-spec/vpp-training
  branch: main

publish_mode: simple # บันทึก = commit เข้า main → deploy อัตโนมัติ
site_url: https://thanapatkong-spec.github.io/vpp-training/
display_url: https://thanapatkong-spec.github.io/vpp-training/

# รูปและไฟล์ที่อัปโหลดผ่านหน้านี้ไปอยู่ใน public/uploads (path บนเว็บ = /uploads/...)
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: articles
    label: บทความ / เนื้อหาอบรม
    label_singular: บทความ
    folder: content/articles
    extension: md
    format: frontmatter
    create: true
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{title}} · {{cohort}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: ชื่อบทความ, widget: string }
      - { name: description, label: คำอธิบายสั้น (แสดงในรายการ), widget: text, required: false }
      - { name: date, label: วันที่, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: cohort, label: รุ่น (ใช้กรอง เช่น รุ่น พ.ย. 2569), widget: string, required: false }
      - { name: draft, label: ฉบับร่าง (ยังไม่เผยแพร่), widget: boolean, default: false, required: false }
      - { name: cover, label: รูปปก (แนะนำ 1200x630), widget: image, required: false }
      - name: files
        label: ไฟล์ให้ดาวน์โหลด
        label_singular: ไฟล์
        widget: list
        required: false
        fields:
          - { name: title, label: ชื่อไฟล์ที่แสดง, widget: string }
          - { name: path, label: ไฟล์, widget: file }
          - { name: note, label: หมายเหตุ (เช่น PDF 1 MB), widget: string, required: false }
      - { name: body, label: เนื้อหา, widget: markdown }

  - name: faq
    label: คำถามที่ถามบ่อย
    label_singular: คำถาม
    folder: content/faq
    extension: yml
    format: yml
    create: true
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{order}} · {{question}}"
    sortable_fields: [order]
    fields:
      - { name: question, label: คำถาม, widget: string }
      - { name: answer, label: คำตอบ, widget: text }
      - { name: order, label: ลำดับ (เลขน้อยขึ้นก่อน), widget: number, value_type: int, default: 100, min: 1 }

  - name: documents
    label: เอกสารแนบ (หน้าแรก)
    label_singular: เอกสาร
    folder: content/documents
    extension: yml
    format: yml
    create: true
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{order}} · {{title}}"
    sortable_fields: [order]
    fields:
      - { name: title, label: ชื่อเอกสารที่แสดง, widget: string }
      - { name: file, label: ไฟล์, widget: file }
      - { name: note, label: หมายเหตุ (เช่น PDF 1 MB), widget: string, required: false }
      - { name: order, label: ลำดับ (เลขน้อยขึ้นก่อน), widget: number, value_type: int, default: 100, min: 1 }

  - name: pages
    label: หน้าเนื้อหา
    files:
      - name: about
        label: เกี่ยวกับ VPP
        file: content/pages/about.md
        format: frontmatter
        fields:
          - { name: title, label: หัวข้อหน้า, widget: string }
          - { name: description, label: คำโปรย, widget: string, required: false }
          - { name: cover, label: รูปปก, widget: image, required: false }
          - { name: body, label: เนื้อหา, widget: markdown }
      - name: collaboration
        label: ความร่วมมือ DR.john x คชาเวท
        file: content/pages/collaboration.md
        format: frontmatter
        fields:
          - { name: title, label: หัวข้อหน้า, widget: string }
          - { name: description, label: คำโปรย, widget: string, required: false }
          - { name: cover, label: รูปปก, widget: image, required: false }
          - { name: body, label: เนื้อหา, widget: markdown }

  - name: albums
    label: อัลบั้มรูป
    label_singular: อัลบั้ม
    folder: content/albums
    extension: yml
    format: yml
    create: true
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: ชื่ออัลบั้ม, widget: string }
      - { name: description, label: คำอธิบาย, widget: text, required: false }
      - { name: date, label: วันที่, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: cohort, label: รุ่น (เช่น รุ่น พ.ย. 2569), widget: string, required: false }
      - { name: cover, label: รูปปกอัลบั้ม (ไม่ใส่ = ใช้รูปแรก), widget: image, required: false }
      - { name: layout, label: สัดส่วนรูปในอัลบั้ม, widget: select, options: [{ label: "สี่เหลี่ยมจัตุรัส (รูปถ่ายทั่วไป)", value: square }, { label: "แนวนอน 16:9 (สไลด์)", value: wide }], default: square, required: false }
      - { name: photos, label: รูปในอัลบั้ม (เลือกหลายรูปพร้อมกันได้), widget: image, multiple: true, required: false }
